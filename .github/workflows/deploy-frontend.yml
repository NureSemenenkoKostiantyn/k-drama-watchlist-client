name: Deploy frontend

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify production build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build production application
        run: npm run build

      - name: Store production application
        uses: actions/upload-artifact@v7
        with:
          name: firebase-hosting-${{ github.sha }}
          path: dist/drama-watch-web/browser
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  deploy-preview:
    name: Deploy preview channel
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Restore production application
        uses: actions/download-artifact@v8
        with:
          name: firebase-hosting-${{ github.sha }}
          path: dist/drama-watch-web/browser

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.1
          package-manager-cache: false

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@15.24.0

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.FIREBASE_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_FIREBASE_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Deploy Firebase Hosting preview
        run: >-
          firebase hosting:channel:deploy
          "pr-${{ github.event.pull_request.number }}"
          --project "${{ vars.FIREBASE_PROJECT_ID }}"
          --expires 7d
          --non-interactive

  deploy-live:
    name: Deploy live channel
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: firebase-hosting-production
    permissions:
      actions: read
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Restore production application
        uses: actions/download-artifact@v8
        with:
          name: firebase-hosting-${{ github.sha }}
          path: dist/drama-watch-web/browser

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.1
          package-manager-cache: false

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@15.24.0

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.FIREBASE_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_FIREBASE_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Deploy Firebase Hosting live channel
        run: >-
          firebase deploy
          --only hosting
          --project "${{ vars.FIREBASE_PROJECT_ID }}"
          --non-interactive
